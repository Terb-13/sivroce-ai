<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Upload artwork for a Pyvot packaging order demo and preview it before the softproof." />
  <title>Artwork — Pyvot Packaging Demo</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div data-shell></div>
  <main class="wrap">
    <p class="eyebrow">Step 3</p>
    <h1>Upload artwork</h1>
    <p class="lede">Add the file that should print on this order. It stays in this browser for the demo and shows on the pack in the next step.</p>
    <dl id="order-summary" class="summary"></dl>
    <div class="preview-frame">
      <p id="artwork-empty">No artwork yet.</p>
      <img id="artwork-preview" alt="" hidden />
    </div>
    <p id="artwork-name"></p>
    <p id="artwork-error" class="form-error" hidden></p>
    <label class="file-input button-secondary">
      Choose image
      <input id="artwork-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
    </label>
    <div class="actions">
      <a class="button-secondary" href="order.html">Back to order</a>
      <a id="continue-artwork" class="button is-disabled" href="softproof.html" aria-disabled="true">Continue to softproof</a>
    </div>
  </main>
  <footer class="site-footer" data-footer></footer>
  <script type="module" src="js/artwork.js"></script>
</body>
</html>
