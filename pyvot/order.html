<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Choose a Pyvot flexible packaging format, quantity, and basic specs. Demo only." />
  <title>Order — Pyvot Packaging Demo</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div data-shell></div>
  <main class="wrap">
    <p class="eyebrow">Step 2</p>
    <h1>Choose a format</h1>
    <p class="lede">Select a pack, then set the quantity and the basic specs for this order.</p>
    <form id="order-form">
      <div id="catalog" class="catalog"></div>
      <p id="spec-hint">Select a format to set its specs.</p>
      <div id="spec-fields" class="spec-grid"></div>
      <label class="field">
        <span>Quantity</span>
        <input id="quantity" name="quantity" type="number" min="1" step="1" inputmode="numeric" required />
      </label>
      <p id="catalog-error" class="form-error" hidden></p>
      <div class="actions">
        <button class="button" type="submit">Continue to artwork</button>
      </div>
    </form>
  </main>
  <footer class="site-footer" data-footer></footer>
  <script type="module" src="js/order.js"></script>
</body>
</html>
